<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Créer un compte Match Up.">
  <title>Match Up | Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Match Up - Accueil">
        <span class="brand-mark">M</span>
        <span class="brand-text">Match <strong>Up</strong></span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
      <nav class="main-nav" id="mainNav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="produits.html">Services</a>
        <a href="a-propos.html">À propos</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">connexion</a>
        <a href="compte.html">mon compte</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container narrow-content">
        <div class="form-card">
          <p class="eyebrow">INSCRIPTION</p>
          <h1 style="font-size:2.2rem">Créer un compte</h1>
          <form id="signupForm" novalidate>
            <div class="form-group">
              <label for="fullName">Nom et prénom *</label>
              <input id="fullName" type="text" autocomplete="name" required>
            </div>
            <div class="form-group">
              <label for="email">Email *</label>
              <input id="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-group">
              <label for="password">Mot de passe * (8 caractères minimum)</label>
              <input id="password" type="password" autocomplete="new-password" required>
            </div>
            <div class="form-group">
              <label for="passwordConfirm">Confirmer le mot de passe *</label>
              <input id="passwordConfirm" type="password" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary" type="submit">S'inscrire</button>
            <p class="form-message" id="authMessage" aria-live="polite"></p>
          </form>
          <p>Déjà un compte ? <a class="text-link" href="login.html">Se connecter</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">© <span id="currentYear"></span> Match Up. Tous droits réservés.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
